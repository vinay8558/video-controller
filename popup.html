<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 220px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 12px; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  input[type="range"] { width: 100%; }
  .presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  button { cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; border-radius: 4px; padding: 4px 8px; font-size: 12px; }
  #speedLabel { font-weight: 600; }
  .hint { font-size: 11px; color: #666; margin-top: 10px; }
</style>
</head>
<body>
  <h3>Video Speed Controller</h3>
  <div class="row">
    <span>Enabled</span>
    <input type="checkbox" id="enabledToggle" />
  </div>
  <div class="row">
    <span>Speed</span>
    <span id="speedLabel">1.00x</span>
  </div>
  <input type="range" id="speedSlider" min="0.1" max="4" step="0.1" value="1" />
  <div class="presets">
    <button data-speed="0.5">0.5x</button>
    <button data-speed="1">1x</button>
    <button data-speed="1.5">1.5x</button>
    <button data-speed="2">2x</button>
    <button data-speed="3">3x</button>
  </div>
  <p class="hint">On-page shortcuts: Alt+D faster, Alt+S slower, Alt+R reset. Drag the floating badge on the video to reposition it.</p>
  <script src="popup.js"></script>
</body>
</html>
